[package]
name = "veyro"
version = "1.3.5"
edition = "2024"
description = "Veyro — Apple Wallet card skinner for Windows"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1.0"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
plist = "1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[[bin]]
name = "veyro"
path = "src/main.rs"
